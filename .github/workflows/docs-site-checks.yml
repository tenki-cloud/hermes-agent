name: Docs Site Checks

on:
  workflow_call:
    inputs:
      commit:
        description: Commit to test and build. Empty keeps the triggering commit.
        type: string
        default: ''

permissions:
  contents: read

jobs:
  docs-site-checks:
    runs-on: tenki-standard-medium-4c-8g
    timeout-minutes: 20
    steps:
      - name: Disk settings like Blacksmith (bench)
        run: |
          echo "write through" | sudo tee /sys/block/vda/queue/write_cache >/dev/null
          sudo mount -o remount,nobarrier,nodiscard,commit=5 /
          sudo sysctl -q -w vm.dirty_bytes=4294967296 vm.swappiness=1
          echo "write_cache=$(cat /sys/block/vda/queue/write_cache) root=$(findmnt -n -o OPTIONS /)"
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}

      - name: Set up the locked site toolchain
        uses: ./.github/actions/setup-pm
        with:
          toolchain: all
          node-package-manager: npm
          node-cache-dependency-path: website/package-lock.json

      - name: Install website dependencies
        uses: ./.github/actions/retry
        with:
          command: just docs-install

      - name: Install ascii-guard
        uses: ./.github/actions/retry
        with:
          command: python -m scripts.ci.python_packages ascii-guard==2.3.0 ruamel.yaml==0.18.17

      - name: Extract skill metadata and regenerate per-skill docs pages + catalogs
        run: just docs-generate

      - name: Committed skill docs match the generator
        # GitHub renders the committed copies, so a regeneration that changes anything
        # means the published catalogs/pages are stale. Fix: `just docs-generate` and commit.
        run: just docs-check-generated

      - name: Check cross-page links resolve on GitHub and on the site
        run: just docs-check-links

      - name: Lint docs diagrams
        run: just docs-lint-diagrams

      - name: Build Docusaurus
        # Build only the default (en) locale in CI — the full bilingual
        # build runs in deploy-site.yml on push-to-main / release.
        # Same pattern Docusaurus uses internally (build:fast --locale en).
        run: just docs-build
